<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#003366">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Simulador ANAC — Piloto Privado</title>
    <style>
        * { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; box-sizing: border-box; }
        :root {
            --azul-escuro: #003366;
            --azul-medio: #0066cc;
            --azul-claro: #eaf2f8;
            --dourado: #ffcc00;
            --verde: #28a745;
            --vermelho: #dc3545;
            --sombra: 0 4px 12px rgba(0,51,102,0.15);
        }
        body { background: linear-gradient(180deg, #eaf2f8 0%, #d4e4f4 100%); min-height: 100vh; padding: 16px; }

        #tela-acesso {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #003366 0%, #0066cc 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; padding: 20px;
        }
        #tela-acesso h1 { color: white; font-size: 26px; margin-bottom: 8px; text-align: center; }
        #tela-acesso p { color: #b3d1f0; margin-bottom: 30px; font-size: 15px; }
        #chave {
            width: 100%; max-width: 300px; padding: 16px 20px; font-size: 18px;
            border: none; border-radius: 12px; text-align: center;
        }
        .btn-entrar {
            margin-top: 20px; padding: 14px 40px; font-size: 18px; font-weight: bold;
            background: var(--dourado); color: var(--azul-escuro);
            border: none; border-radius: 12px; cursor: pointer;
            transition: 0.3s;
        }
        .btn-entrar:hover { transform: scale(1.05); }
        .erro { color: #ffb3b3; margin-top: 15px; display: none; font-size: 14px; }

        .tela { display: none; max-width: 760px; margin: 0 auto; animation: fadeIn 0.3s ease; }
        .ativa { display: block; }
        @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:none;} }

        .cabecalho {
            text-align: center; margin-bottom: 24px; padding: 20px;
            background: white; border-radius: 16px; box-shadow: var(--sombra);
        }
        .cabecalho h1 { color: var(--azul-escuro); font-size: 22px; margin-bottom: 4px; }
        .cabecalho p { color: #666; font-size: 14px; }

        .card {
            background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px;
            box-shadow: var(--sombra);
        }
        .btn-materia {
            display: flex; align-items: center; gap: 12px; width: 100%;
            padding: 16px 20px; margin: 8px 0;
            background: linear-gradient(90deg, #0066cc, #0077ed);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; text-align: left;
        }
        .btn-materia:hover { transform: translateY(-2px); }
        .btn-completo { background: linear-gradient(90deg, var(--azul-escuro), #004d99); font-size: 17px; padding: 18px; }
        hr { border: none; border-top: 1px solid #e8eef3; margin: 16px 0; }

        .topo {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #e8eef3;
        }
        .nome-materia { color: var(--azul-escuro); font-weight: bold; font-size: 20px; }
        .contador {
            background: var(--azul-claro); color: var(--azul-escuro);
            padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 14px;
        }

        .questao {
            background: white; border-radius: 16px; padding: 26px; margin-bottom: 20px;
            box-shadow: var(--sombra);
        }
        .pergunta {
            font-size: 19px; font-weight: 600; color: var(--azul-escuro);
            margin-bottom: 26px; line-height: 1.6;
        }
        .opcao {
            padding: 16px 20px; margin: 10px 0;
            background: var(--azul-claro); border-left: 4px solid transparent;
            border-radius: 10px; font-size: 16px; cursor: pointer;
            transition: all 0.25s;
        }
        .opcao:hover:not(.bloqueada) { background: #d4e4f4; transform: translateX(4px); }
        .opcao.bloqueada { cursor: default; pointer-events: none; opacity: 0.9; }
        .opcao.correta {
            background: #e6f9e6 !important; border-left-color: var(--verde) !important;
            color: #155724 !important; font-weight: bold;
        }
        .opcao.errada {
            background: #ffebee !important; border-left-color: var(--vermelho) !important;
            color: #721c24 !important; font-weight: bold;
        }

        .botoes { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
        .btn {
            flex: 1; min-width: 130px; padding: 15px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;

        .btn-prox:hover { background: #0052a3; }
        .btn-final { background: var(--verde); color: white; }
        .btn-final:hover { background: #218838; }
        .oculto { display: none !important; }

            padding: 36px 24px; border-radius: 16px; text-align: center;
            font-size: 20px; font-weight: bold; margin-top: 20px; line-height: 2;

            padding: 10px 0; border-bottom: 1px solid #eee;

        }

</head>
<body>

<div id="tela-acesso">
    <h1>✈️ Simulador ANAC</h1>
    <p>Piloto Privado — PPA</p>
    <input type="password" id="chave" placeholder="Digite sua chave de acesso">
    <button class="btn-entrar" onclick="verificarChave()">ENTRAR</button>

</div>

        <h3>📊 Últimos Resultados</h3>
        <div id="lista-historico"></div>
    </div>
</div>

<div id="simulado" class="tela">
    <div class="topo">
        <h2 class="nome-materia" id="titulo-materia"></h2>
        <span class="contador" id="contador"></span>
    </div>
    <div id="area-questao"></div>
    <div class="botoes">
        <button class="btn btn-voltar" onclick="voltar()">← Voltar</button>
        <button class="btn btn-prox oculto" id="btn-prox" onclick="proxima()">Próxima →</button>
        <button class="btn btn-final oculto" id="btn-fim" onclick="finalizar()">✅ Resultado</button>
    </div>
    <div id="resultado" class="resultado oculto"></div>
</div>

<script>
const CHAVE_CORRETA = "PPA2026";

function verificarChave() {
    const digitada = document.getElementById('chave').value.trim();
    if (digitada === CHAVE_CORRETA) {
        document.getElementById('tela-acesso').style.display = 'none';
        ativarTela('inicial');
        carregarHistorico();
    } else {
        document.getElementById('msg-erro').style.display = 'block';
        document.getElementById('chave').value = '';
    }
}

function ativarTela(nome) {
    document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
    document.getElementById(nome).classList.add('ativa');
}

function embaralhar(arr) { 
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a; 
}

function embaralharAlternativas(questao) {
    const alternativas = questao.o.map((texto, indice) => ({
        texto, correta: indice === questao.correta
    }));
    const embaralhado = embaralhar(alternativas);
    return {
        p: questao.p,
        o: embaralhado.map(a => a.texto),
        correta: embaralhado.findIndex(a => a.correta)
    };
}

let estado = { lista: [], indice: 0, acertos: 0, bloqueado: false };

function pegar20Embaralhadas(chave) {
    const selecionadas = embaralhar(BANCO[chave].questoes).slice(0, 20);
    return selecionadas.map(q => embaralharAlternativas(q));
}

function iniciarCompleto() {
    let tudo = [];
    for (const k in BANCO) {
        const selecionadas = embaralhar(BANCO[k].questoes).slice(0, 20);
        tudo = tudo.concat(selecionadas.map(q => embaralharAlternativas(q)));
    }
    estado.lista = embaralhar(tudo);
    estado.indice = 0; estado.acertos = 0; estado.bloqueado = false;
    document.getElementById('titulo-materia').textContent = '✈️ SIMULADO COMPLETO — 100 Questões';
    ativarTela('simulado');
    mostrarQuestao();
}

function iniciarMateria(chave) {
    estado.lista = pegar20Embaralhadas(chave);
    estado.indice = 0; estado.acertos = 0; estado.bloqueado = false;
    document.getElementById('titulo-materia').textContent = BANCO[chave].nome;
    ativarTela('simulado');
    mostrarQuestao();
}

function mostrarQuestao() {
    const q = estado.lista[estado.indice];
    document.getElementById('contador').textContent = `${estado.indice + 1}/${estado.lista.length}`;
    document.getElementById('resultado').classList.add('oculto');
    document.getElementById('btn-prox').classList.add('oculto');
    document.getElementById('btn-fim').classList.add('oculto');

    document.getElementById('area-questao').innerHTML = `
        <div class="questao">
            <p class="pergunta">${estado.indice + 1}. ${q.p}</p>
            <div class="opcao" id="opt0" onclick="clicar(0)">A) ${q.o[0]}</div>
            <div class="opcao" id="opt1" onclick="clicar(1)">B) ${q.o[1]}</div>
            <div class="opcao" id="opt2" onclick="clicar(2)">C) ${q.o[2]}</div>
            <div class="opcao" id="opt3" onclick="clicar(3)">D) ${q.o[3]}</div>
        </div>
    `;
    estado.bloqueado = false;
}

function clicar(escolha) {
    if (estado.bloqueado) return;
    estado.bloqueado = true;
    const q = estado.lista[estado.indice];

    for (let i = 0; i < 4; i++) {
        const el = document.getElementById('opt' + i);
        el.classList.add('bloqueada');
        if (i === q.correta) {
            el.classList.add('correta');
        } else if (i === escolha) {
            el.classList.add('errada');
        }
    }
    if (escolha === q.correta) {
        estado.acertos++;
    }

    if (estado.indice < estado.lista.length - 1) {
        document.getElementById('btn-prox').classList.remove('oculto');
    } else {
        document.getElementById('btn-fim').classList.remove('oculto');
    }
}

function proxima() { 
    estado.indice++; 
    mostrarQuestao(); 
}

function finalizar() {
    const porcento = Math.round((estado.acertos / estado.lista.length) * 100);
    const aprov = porcento >= 70;
    salvarResultado(porcento, aprov);

    document.getElementById('area-questao').innerHTML = '';
    document.getElementById('btn-prox').classList.add('oculto');
    document.getElementById('btn-fim').classList.add('oculto');

    const res = document.getElementById('resultado');
    res.className = `resultado ${aprov ? 'aprovado' : 'reprovado'}`;
    res.innerHTML = `
        ${aprov ? '✅ APROVADO!' : '❌ REPROVADO'}<br><br>
        Acertos: ${estado.acertos} de ${estado.lista.length}<br>
        Porcentagem: ${porcento}%<br>
        Nota de corte: 70%
    `;
    res.classList.remove('oculto');
}

function voltar() { 
    ativarTela('inicial'); 
    carregarHistorico(); 
}

function salvarResultado(porc, aprov) {
    let hist = JSON.parse(localStorage.getItem('simulador_anac_hist') || '[]');
    hist.unshift({ 
        data: new Date().toLocaleDateString('pt-BR'), 
        porcentagem: porc, 
        aprovado: aprov 
    });
    hist = hist.slice(0, 5);
    localStorage.setItem('simulador_anac_hist', JSON.stringify(hist));
}

function carregarHistorico() {
    const hist = JSON.parse(localStorage.getItem('simulador_anac_hist') || '[]');
    const lista = document.getElementById('lista-historico');
    if (hist.length === 0) {
        lista.innerHTML = '<p style="color:#888; text-align:center; padding:10px;">Nenhum resultado ainda.</p>';
        return;
    }
    lista.innerHTML = hist.map(h => `
        <div class="item-hist">
            <span>${h.data}</span>
            <span style="font-weight:bold; font-size:17px;">${h.porcentagem}% ${h.aprovado ? '✅' : '❌'}</span>
        </div>
    `).join('');
}
