<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#003366">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Simulado PP — Piloto Privado</title>
    <style>
        * { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; box-sizing: border-box; }
        :root {
            --azul-escuro: #003366;
            --azul-medio: #0066cc;
            --azul-claro: #eaf2f8;
            --dourado: #ffcc00;
            --verde: #28a745;
            --vermelho: #dc3545;
            --sombra: 0 4px 12px rgba(0,51,102,0.15);
        }
        body { background: linear-gradient(180deg, #eaf2f8 0%, #d4e4f4 100%); min-height: 100vh; padding: 16px; }

        #tela-acesso {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #003366 0%, #0066cc 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; padding: 20px;
        }
        #tela-acesso .logo-aviao { margin-bottom: 20px; }
        #tela-acesso .logo-aviao img { width: 140px; height: auto; }
        #tela-acesso h1 { color: white; font-size: 26px; margin-bottom: 8px; text-align: center; }
        #tela-acesso p { color: #b3d1f0; margin-bottom: 30px; font-size: 15px; text-align: center; }
        #chave {
            width: 100%; max-width: 300px; padding: 16px 20px; font-size: 18px;
            border: none; border-radius: 12px; text-align: center; outline: none;
        }
        .btn-entrar {
            margin-top: 20px; padding: 14px 40px; font-size: 18px; font-weight: bold;
            background: var(--dourado); color: var(--azul-escuro);
            border: none; border-radius: 12px; cursor: pointer; transition: 0.3s;
        }
        .btn-entrar:hover { transform: scale(1.05); }
        .erro { color: #ffb3b3; margin-top: 15px; display: none; font-size: 14px; }

        .tela { display: none; max-width: 760px; margin: 0 auto; animation: aparecer 0.3s ease; }
        .ativa { display: block; }
        @keyframes aparecer { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:none;} }

        .cabecalho {
            text-align: center; margin-bottom: 24px; padding: 20px;
            background: white; border-radius: 16px; box-shadow: var(--sombra);
        }
        .cabecalho .logo-topo { width: 60px; margin-bottom: 10px; }
        .cabecalho h1 { color: var(--azul-escuro); font-size: 22px; margin-bottom: 4px; }
        .cabecalho p { color: #666; font-size: 14px; }

        .card {
            background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px;
            box-shadow: var(--sombra);
        }
        .btn-materia {
            display: flex; align-items: center; gap: 12px; width: 100%;
            padding: 16px 20px; margin: 8px 0;
            background: linear-gradient(90deg, #0066cc, #0077ed);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; text-align: left; flex-wrap: wrap;
        }
        .btn-materia:hover { transform: translateY(-2px); }
        .btn-completo { background: linear-gradient(90deg, var(--azul-escuro), #004d99); font-size: 17px; padding: 18px; }
        hr { border: none; border-top: 1px solid #e8eef3; margin: 16px 0; }

        .topo {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #e8eef3;
        }
        .nome-materia { color: var(--azul-escuro); font-weight: bold; font-size: 20px; }
        .contador {
            background: var(--azul-claro); color: var(--azul-escuro);
            padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 14px;
        }

        .questao {
            background: white; border-radius: 16px; padding: 26px; margin-bottom: 20px;
            box-shadow: var(--sombra);
        }
        .pergunta {
            font-size: 19px; font-weight: 600; color: var(--azul-escuro);
            margin-bottom: 26px; line-height: 1.6;
        }
        .opcao {
            padding: 16px 20px; margin: 10px 0;
            background: var(--azul-claro); border-left: 4px solid transparent;
            border-radius: 10px; font-size: 16px; cursor: pointer;
            transition: all 0.25s;
        }
        .opcao:hover:not(.bloqueada) { background: #d4e4f4; transform: translateX(4px); }
        .opcao.bloqueada { cursor: default; pointer-events: none; opacity: 0.9; }
        .opcao.correta {
            background: #e6f9e6 !important; border-left-color: var(--verde) !important;
            color: #155724 !important; font-weight: bold;
        }
        .opcao.errada {
            background: #ffebee !important; border-left-color: var(--vermelho) !important;
            color: #721c24 !important; font-weight: bold;
        }

        .botoes { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
        .btn {
            flex: 1; min-width: 130px; padding: 15px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-voltar { background: #e8eef3; color: #444; }
        .btn-voltar:hover { background: #d0d9e3; }
        .btn-prox { background: var(--azul-medio); color: white; }
        .btn-prox:hover { background: #0052a3; }
        .btn-final { background: var(--verde); color: white; }
        .btn-final:hover { background: #218838; }
        .oculto { display: none !important; }

        .resultado {
            padding: 36px 24px; border-radius: 16px; text-align: center;
            font-size: 20px; font-weight: bold; margin-top: 20px; line-height: 2;
        }
        .aprovado { background: linear-gradient(135deg, #e6f9e6, #c8f0c8); color: #155724; border: 3px solid var(--verde); }
        .reprovado { background: linear-gradient(135deg, #ffebee, #ffd6d6); color: #721c24; border: 3px solid var(--vermelho); }

        .historico { margin-top: 16px; }
        .historico h3 { color: var(--azul-escuro); font-size: 16px; margin-bottom: 12px; }
        .item-hist {
            padding: 10px 0; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }
        small { opacity: 0.7; margin-left: 8px; }
    </style>
</head>
<body>

<div id="tela-acesso">
    <div class="logo-aviao">
        <img src="icon-512.png" alt="Avião — Simulado PP">
    </div>
    <h1>✈️ Simulado PP</h1>
    <p>Piloto Privado — PPA • 1.520 Questões</p>

    </div>
    <div class="card">
        <button class="btn-materia btn-completo" onclick="iniciarCompleto()">
            📝 <strong>SIMULADO COMPLETO — 100 Questões</strong>
        </button>
        <hr>
        <button class="btn-materia" onclick="iniciarMateria('teoriaVoo')">✈️ Teoria de Voo <small>304 questões</small></button>
        <button class="btn-materia" onclick="iniciarMateria('conhecimentosTecnicos')">🔧 Conhecimentos Técnicos <small>304 questões</small></button>
        <button class="btn-materia" onclick="iniciarMateria('navegacaoVisual')">🧭 Navegação Aérea Visual <small>304 questões</small></button>
        <button class="btn-materia" onclick="iniciarMateria('regulamento')">📋 Regulamento de Tráfego Aéreo <small>304 questões</small></button>
        <button class="btn-materia" onclick="iniciarMateria('meteorologia')">🌤️ Meteorologia <small>304 questões</small></button>
    </div>
    <div class="card historico">
        <h3>📊 Últimos Resultados</h3>
        <div id="lista-historico"></div>
    </div>
</div>

<div id="simulado" class="tela">
    <div class="topo">
        <h2 class="nome-materia" id="titulo-materia"></h2>
        <span class="contador" id="contador"></span>
    </div>
    <div id="area-questao"></div>
    <div class="botoes">
        <button class="btn btn-voltar" onclick="voltar()">← Voltar</button>
        <button class="btn btn-prox oculto" id="btn-prox" onclick="proxima()">Próxima →</button>
        <button class="btn btn-final oculto" id="btn-fim" onclick="finalizar()">✅ Resultado</button>
    </div>
    <div id="resultado" class="resultado oculto"></div>
</div>

<script>
const CHAVE_CORRETA = "PPA2026";

function verificarChave() {
    const digitada = document.getElementById('chave').value.trim();
    if (digitada === CHAVE_CORRETA) {
        document.getElementById('tela-acesso').style.display = 'none';
        ativarTela('inicial');
        carregarHistorico();
    } else {
        document.getElementById('msg-erro').style.display = 'block';
        document.getElementById('chave').value = '';
    }
}

document.getElementById('chave').addEventListener('keydown', e => {
    if (e.key === 'Enter') verificarChave();
});

function ativarTela(nome) {
    document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
    document.getElementById(nome).classList.add('ativa');
}

function embaralhar(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function embaralharAlternativas(q) {
    const alternativas = q.o.map((texto, i) => ({ texto, correta: i === q.correta }));
    const embaralhadas = embaralhar(alternativas);
    return {
        p: q.p,
        o: embaralhadas.map(a => a.texto),
        correta: embaralhadas.findIndex(a => a.correta)
    };
}

let indiceAtual = 0;
let acertos = 0;
let respondida = false;

            { p: "Os ailerons comandam o movimento de:", o: ["Rolamento", "Arfagem", "Guinada", "Subida"], correta: 0 },

            { p: "O centro de pressão é o ponto onde:", o: ["A resultante da sustentação atua", "O peso da aeronave se concentra", "O arrasto é máximo", "A pressão é zero"], correta: 0 }
        ]
    },

        questoes: [

            { p: "O tanque de combustível deve ter dispositivo para:", o: ["Impedir retorno de chama", "Aumentar o volume", "Resfriar o combustível", "Filtrar o ar"], correta: 0 },
            { p: "O filtro de combustível deve ser verificado:", o: ["Antes de cada voo", "A cada 100 horas", "Mensalmente", "Anualmente"], correta: 0 },
            { p: "A hélice converte a potência do motor em:", o: ["Empuxo", "Velocidade", "Rotação", "Torque"], correta: 0 },
            { p: "O sistema de freios atua sobre:", o: ["As rodas do trem de pouso", "A hélice", "Os ailerons", "O elevador"], correta: 0 }
        ]
    },
    navegacaoVisual: {

            { p: "O norte de quadrícula é:", o: ["Paralelo aos meridianos da carta", "O norte magnético", "O norte verdadeiro", "Sempre igual ao norte da bússola"], correta: 0 },
            { p: "A velocidade sobre o solo é:", o: ["Velocidade real em relação à terra", "Velocidade indicada no painel", "Velocidade corrigida da temperatura", "Velocidade do vento somada"], correta: 0 }

    },

let historico = [];

function iniciarMateria(nome) {
    const banco = BANCO[nome];
    document.getElementById('titulo-materia').textContent = banco.nome;
    const selecionadas = embaralhar(banco.questoes).slice(0, 20).map(q => embaralharAlternativas(q));
    simuladoAtual = selecionadas;
    indiceAtual = 0;
    acertos = 0;
    respondida = false;
    ativarTela('simulado');
    mostrarQuestao();
}

function iniciarCompleto() {
    let todas = [];
    for (const chave in BANCO) {
        todas = todas.concat(embaralhar(BANCO[chave].questoes).slice(0, 20));
    }
    document.getElementById('titulo-materia').textContent = "📝 Simulado Completo";
    simuladoAtual = embaralhar(todas).map(q => embaralharAlternativas(q));
    indiceAtual = 0;
    acertos = 0;
    respondida = false;
    ativarTela('simulado');
    mostrarQuestao();
}

function mostrarQuestao() {
    respondida = false;
    const q = simuladoAtual[indiceAtual];
    document.getElementById('contador').textContent = `${indiceAtual + 1}/${simuladoAtual.length}`;
    document.getElementById('resultado').classList.add('oculto');
    document.getElementById('btn-prox').classList.add('oculto');
    document.getElementById('btn-fim').classList.add('oculto');
    document.getElementById('area-questao').innerHTML = `
        <div class="questao">
            <p class="pergunta">${indiceAtual + 1}. ${q.p}</p>
            ${q.o.map((texto, i) => `
                <div class="opcao" id="op-${i}" onclick="responder(${i})">
                    ${String.fromCharCode(65 + i)}) ${texto}
                </div>
            `).join('')}
        </div>
    `;
}

function responder(escolhida) {
    if (respondida) return;
    respondida = true;
    const q = simuladoAtual[indiceAtual];
    const ops = document.querySelectorAll('.opcao');
    ops.forEach(op => op.classList.add('bloqueada'));
    ops[q.correta].classList.add('correta');
    if (escolhida !== q.correta) ops[escolhida].classList.add('errada');
    else acertos++;
    if (indiceAtual < simuladoAtual.length - 1) {
        document.getElementById('btn-prox').classList.remove('oculto');
    } else {
        document.getElementById('btn-fim').classList.remove('oculto');
    }
}

function proxima() {
    indiceAtual++;
    mostrarQuestao();
}

function finalizar() {
    const total = simuladoAtual.length;
    const porcentagem = Math.round((acertos / total) * 100);
    const aprovado = porcentagem >= 70;
    const res = document.getElementById('resultado');
    res.className = `resultado ${aprovado ? 'aprovado' : 'reprovado'}`;
    res.innerHTML = `
        ${aprovado ? '🎉 PARABÉNS! APROVADO!' : '📚 ESTUDE MAIS!'}<br>
        Acertos: ${acertos} de ${total}<br>
        Porcentagem: ${porcentagem}%
    `;
    res.classList.remove('oculto');
    salvarResultado(porcentagem, aprovado);
}

function salvarResultado(pct, ok) {
    historico.unshift({ data: new Date().toLocaleDateString('pt-BR'), pct, ok });
    if (historico.length > 5) historico.pop();
    localStorage.setItem('simuladoPP', JSON.stringify(historico));
    carregarHistorico();
}

function carregarHistorico() {
    const salvo = localStorage.getItem('simuladoPP');
    if (salvo) historico = JSON.parse(salvo);
    const lista = document.getElementById('lista-historico');
    if (!historico.length) {
        lista.innerHTML = '<p style="color:#888;font-size:14px;">Nenhum resultado ainda.</p>';
        return;
    }
    lista.innerHTML = historico.map(item => `
        <div class="item-hist">
            <span>${item.data}</span>
            <span style="color:${item.ok ? '#28a745' : '#dc3545'};font-weight:bold;">
                ${item.pct}% ${item.ok ? '✅' : '❌'}
            </span>
        </div>
    `).join('');
}

function voltar() {
    ativarTela('inicial');
}
</script>
</body>
</html>
