            background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px;
            box-shadow: var(--sombra);
        }
        .btn-materia {
            display: flex; align-items: center; gap: 12px; width: 100%;
            padding: 16px 20px; margin: 8px 0;
            background: linear-gradient(90deg, #0066cc, #0077ed);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; text-align: left;
        }
        .btn-materia:hover { transform: translateY(-2px); }
        .btn-completo { background: linear-gradient(90deg, var(--azul-escuro), #004d99); font-size: 17px; padding: 18px; }

            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #e8eef3;
        }
        .nome-materia { color: var(--azul-escuro); font-weight: bold; font-size: 20px; }

            background: var(--azul-claro); color: var(--azul-escuro);

        }

            background: white; border-radius: 16px; padding: 26px; margin-bottom: 20px;
            box-shadow: var(--sombra);
        }
        .pergunta {
            font-size: 18px; font-weight: 600; color: var(--azul-escuro);

        }

            padding: 14px 18px; margin: 8px 0;
            background: var(--azul-claro); border-left: 4px solid transparent;
            border-radius: 10px; font-size: 15px; cursor: pointer;
            transition: all 0.25s;

        .opcao.bloqueada { cursor: default; pointer-events: none; opacity: 0.9; }
        .opcao.correta {
            background: #e6f9e6 !important; border-left-color: var(--verde) !important;
            color: #155724 !important; font-weight: bold;
        }
        .opcao.errada {
            background: #ffebee !important; border-left-color: var(--vermelho) !important;
            color: #721c24 !important; font-weight: bold;
        }

        .botoes { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }

        .btn-final { background: var(--verde); color: white; }

function ativarTela(nome) {
    document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
    document.getElementById(nome).classList.add('ativa');
}

function embaralhar(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function embaralharAlternativas(q) {
    const alternativas = q.o.map((texto, i) => ({ texto, correta: i === q.correta }));
    const embaralhadas = embaralhar(alternativas);
    return {
        p: q.p,
        o: embaralhadas.map(a => a.texto),
        correta: embaralhadas.findIndex(a => a.correta)
    };
}

// ==================================================
// INICIAR SIMULADO
// ==================================================
function iniciarMateria(nomeMateria) {
    const materia = BANCO[nomeMateria];
    simuladoAtual = embaralhar(materia.questoes).map(q => embaralharAlternativas(q));
    indiceAtual = 0;
    acertos = 0;
    respondida = false;
    tipoSimulado = materia.nome;
    document.getElementById('titulo-materia').textContent = materia.nome;
    ativarTela('simulado');
    exibirQuestao();
}

function iniciarCompleto() {
    const porMateria = 20;
    let todasQuestoes = [];
    Object.values(BANCO).forEach(materia => {
        const selecionadas = embaralhar(materia.questoes).slice(0, porMateria);
        todasQuestoes = todasQuestoes.concat(selecionadas.map(q => embaralharAlternativas(q)));
    });
    simuladoAtual = embaralhar(todasQuestoes);
    indiceAtual = 0;
    acertos = 0;
    respondida = false;
    tipoSimulado = "📝 Simulado Completo";
    document.getElementById('titulo-materia').textContent = tipoSimulado;
    ativarTela('simulado');
    exibirQuestao();
}

// ==================================================
// EXIBIR QUESTÃO
// ==================================================
function exibirQuestao() {
    const q = simuladoAtual[indiceAtual];
    document.getElementById('contador').textContent = `${indiceAtual + 1}/${simuladoAtual.length}`;
    document.getElementById('resultado').classList.add('oculto');
    document.getElementById('btn-prox').classList.add('oculto');
    document.getElementById('btn-fim').classList.add('oculto');
    respondida = false;

    const area = document.getElementById('area-questao');
    area.innerHTML = `
        <div class="pergunta">${indiceAtual + 1}. ${q.p}</div>
        ${q.o.map((texto, i) => `
            <div class="opcao" data-indice="${i}" onclick="selecionarResposta(${i})">
                ${String.fromCharCode(65 + i)}) ${texto}
            </div>
        `).join('')}
    `;
}

// ==================================================
// SELECIONAR RESPOSTA
// ==================================================
function selecionarResposta(indiceEscolhido) {
    if (respondida) return;
    respondida = true;

    const q = simuladoAtual[indiceAtual];
    const opcoes = document.querySelectorAll('.opcao');

    opcoes.forEach((op, i) => {
        op.classList.add('bloqueada');
        if (i === q.correta) op.classList.add('correta');
        else if (i === indiceEscolhido) op.classList.add('errada');
    });

    if (indiceEscolhido === q.correta) acertos++;

    if (indiceAtual < simuladoAtual.length - 1) {
        document.getElementById('btn-prox').classList.remove('oculto');
    } else {
        document.getElementById('btn-fim').classList.remove('oculto');
    }
}

// ==================================================
// NAVEGAÇÃO
// ==================================================
function proxima() {
    indiceAtual++;
    exibirQuestao();
}

function voltar() {
    ativarTela('inicial');
}

function finalizar() {
    const porcentagem = Math.round((acertos / simuladoAtual.length) * 100);
    const aprovado = porcentagem >= 70;

    const resEl = document.getElementById('resultado');
    resEl.className = `resultado ${aprovado ? 'aprovado' : 'reprovado'}`;
    resEl.innerHTML = `
        ${aprovado ? '🎉 APROVADO!' : '📋 REPROVADO'}<br>
        Acertos: ${acertos} de ${simuladoAtual.length}<br>
        Porcentagem: ${porcentagem}%<br>
        ${aprovado ? 'Parabéns! ✈️' : 'Estude mais e tente novamente! 💪'}
    `;
    resEl.classList.remove('oculto');

    salvarHistorico(tipoSimulado, acertos, simuladoAtual.length, porcentagem);
}

// ==================================================
// HISTÓRICO
// ==================================================
function salvarHistorico(tipo, certas, total, porcentagem) {
    let historico = JSON.parse(localStorage.getItem('simulado_historico') || '[]');
    historico.unshift({ tipo, certas, total, porcentagem, data: new Date().toLocaleString('pt-BR') });
    historico = historico.slice(0, 5);
    localStorage.setItem('simulado_historico', JSON.stringify(historico));
    carregarHistorico();
}

function carregarHistorico() {
    const lista = document.getElementById('lista-historico');
    const historico = JSON.parse(localStorage.getItem('simulado_historico') || '[]');
    if (historico.length === 0) {
        lista.innerHTML = '<p style="color:#888;font-size:14px;">Nenhum resultado ainda.</p>';
        return;
    }
    lista.innerHTML = historico.map(h => `
        <div class="item-hist">
            <span style="font-size:14px;">${h.tipo}</span>
            <span style="font-weight:bold;color:${h.porcentagem >= 70 ? '#28a745' : '#dc3545'}">${h.porcentagem}%</span>
        </div>
    `).join('');
}

carregarHistorico();
</script>
