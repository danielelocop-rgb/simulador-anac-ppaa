        .opcao.correta {
            background: #e6f9e6 !important; border-left-color: var(--verde) !important;

// Embaralhar array
function embaralhar(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// Embaralhar alternativas
function embaralharAlternativas(q) {
    const alternativas = q.o.map((texto, i) => ({ texto, correta: i === q.correta }));
    const embaralhadas = embaralhar(alternativas);
    return {
        p: q.p,
        o: embaralhadas.map(a => a.texto),
        correta: embaralhadas.findIndex(a => a.correta)
    };
}
